[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chicago-food-inspections-data-quality"
version = "0.1.0"
description = "An incremental Python ETL pipeline for profiling, cleaning, validating, and publishing Chicago food inspection data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Théo Devarenne" }
]
dependencies = [
    "pandas>=3.0,<4.0",
    "pyarrow>=25.0,<26.0",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
food-inspections-pipeline = "data_quality_pipeline.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
